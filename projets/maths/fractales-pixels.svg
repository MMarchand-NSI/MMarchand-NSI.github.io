    <circle cx="95" cy="165" r="2"/>
    <circle cx="125" cy="165" r="2"/>
    <circle cx="155" cy="165" r="2"/>
    <circle cx="185" cy="165" r="2"/>
    <circle cx="215" cy="165" r="2"/>
    <circle cx="245" cy="165" r="2"/>
    <circle cx="275" cy="165" r="2"/>
    <circle cx="305" cy="165" r="2"/>
    <circle cx="95" cy="195" r="2"/>
    <circle cx="125" cy="195" r="2"/>
    <circle cx="155" cy="195" r="2"/>
    <circle cx="185" cy="195" r="2"/>
    <circle cx="215" cy="195" r="2"/>
    <circle cx="245" cy="195" r="2"/>
    <circle cx="275" cy="195" r="2"/>
    <circle cx="305" cy="195" r="2"/>
    <circle cx="95" cy="225" r="2"/>
    <circle cx="125" cy="225" r="2"/>
    <circle cx="155" cy="225" r="2"/>
