  <circle cx="95.0" cy="75.0" r="5" fill="#1565c0"/>
  <circle cx="215.0" cy="195.0" r="5" fill="#c62828"/>
  <circle cx="245.0" cy="165.0" r="5" fill="#2e7d32"/>
  <circle cx="125.0" cy="225.0" r="5" fill="#e65100"/>
  <circle cx="416" cy="75" r="5" fill="#1565c0"/>
  <text x="428" y="80" fill="#1565c0" font-size="13">pixel (0, 0) : −2,5 + 1,5i</text>
  <circle cx="416" cy="97" r="5" fill="#c62828"/>
  <text x="428" y="102" fill="#c62828" font-size="13">pixel (4, 4) : −0,5 − 0,5i, centre de la vue</text>
  <circle cx="416" cy="119" r="5" fill="#2e7d32"/>
  <text x="428" y="124" fill="#2e7d32" font-size="13">pixel (5, 3) : 0, origine du plan</text>
  <circle cx="416" cy="141" r="5" fill="#e65100"/>
  <text x="428" y="146" fill="#e65100" font-size="13">pixel (1, 5) : −2 − i</text>
  <!-- Le pas et l'unité -->
  <g stroke="#2e7d32" stroke-width="1.5">
    <line x1="95" y1="332" x2="125" y2="332"/><line x1="95" y1="326" x2="95" y2="338"/><line x1="125" y1="326" x2="125" y2="338"/>
  </g>
  <text x="133" y="337" fill="#2e7d32">pas = 0,5 : un pixel</text>
  <g stroke="#6a1b9a" stroke-width="1.5">
    <line x1="80" y1="360" x2="320" y2="360"/><line x1="80" y1="354" x2="80" y2="366"/><line x1="320" y1="354" x2="320" y2="366"/>
  </g>
  <text x="200" y="382" fill="#6a1b9a" text-anchor="middle">étendue = 4 : toute la largeur, soit 8 pixels</text>
  <!-- Les deux règles et la légende -->
  <text x="410" y="180" fill="#212121">Une unité du plan :</text>
  <text x="410" y="200" fill="#212121" font-weight="bold">deux pixels.</text>
  <text x="410" y="240" fill="#212121">x augmente de 1 :</text>
  <text x="410" y="260" fill="#212121">on avance d'un pas</text>
  <text x="410" y="280" fill="#212121">vers la droite.</text>
  <text x="410" y="320" fill="#212121">y augmente de 1 :</text>
  <text x="410" y="340" fill="#212121">on descend d'un pas,</text>
  <text x="410" y="360" fill="#212121">la partie imaginaire</text>
  <text x="410" y="380" fill="#212121" font-weight="bold">diminue.</text>
  <circle cx="416" cy="405" r="3" fill="#616161"/>
  <text x="426" y="410" fill="#212121" font-size="13">le nombre que représente</text>
  <text x="426" y="428" fill="#212121" font-size="13">le pixel : le centre</text>
  <text x="426" y="446" fill="#212121" font-size="13">de sa case</text>
</svg>
