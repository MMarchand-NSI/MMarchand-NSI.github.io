  <rect x="200" y="180" width="30" height="30" fill="#ffcdd2"/>
  <rect x="230" y="150" width="30" height="30" fill="#c8e6c9"/>
  <!-- Grille de 8 x 8 pixels -->
  <g stroke="#bdbdbd" stroke-width="1" fill="none">
    <rect x="80" y="60" width="240" height="240"/>
    <line x1="110" y1="60" x2="110" y2="300"/>
