    <text x="66" y="79">0</text>
    <text x="125" y="316">1</text>
    <text x="66" y="109">1</text>
    <text x="155" y="316">2</text>
    <text x="66" y="139">2</text>
    <text x="185" y="316">3</text>
    <text x="66" y="169">3</text>
    <text x="215" y="316">4</text>
    <text x="66" y="199">4</text>
    <text x="245" y="316">5</text>
    <text x="66" y="229">5</text>
    <text x="275" y="316">6</text>
    <text x="66" y="259">6</text>
    <text x="305" y="316">7</text>
    <text x="66" y="289">7</text>
    <text x="338" y="316">x</text>
    <text x="46" y="52">y</text>
  </g>
  <!-- Axes du plan complexe -->
  <g stroke="#212121" stroke-width="2">
    <line x1="74" y1="165.0" x2="345" y2="165.0"/>
    <line x1="245.0" y1="300" x2="245.0" y2="30"/>
  </g>
  <polygon points="350,165.0 340,160.0 340,170.0" fill="#212121"/>
  <polygon points="245.0,25 240.0,35 250.0,35" fill="#212121"/>
  <text x="354" y="170.0" fill="#212121">réels</text>
  <text x="255.0" y="30" fill="#212121">imaginaires</text>
  <!-- Graduations : une unité tous les deux pixels -->
  <g fill="#616161" font-size="12">
    <text x="125.0" y="54" text-anchor="middle">−2</text>
    <text x="185.0" y="54" text-anchor="middle">−1</text>
    <text x="305.0" y="54" text-anchor="middle">1</text>
    <text x="326" y="109.0">i</text>
    <text x="326" y="229.0">−i</text>
    <text x="326" y="289.0">−2i</text>
  </g>
  <!-- Le point représenté par chaque pixel : le centre de sa case -->
