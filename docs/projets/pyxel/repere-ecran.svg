<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280" width="360" height="280" font-family="sans-serif" font-size="16">
  <defs>
    <marker id="fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
  </defs>
  <!-- fond blanc : lisible en mode clair comme en mode sombre -->
  <rect x="0" y="0" width="360" height="280" fill="#ffffff"/>
  <!-- l'écran -->
  <rect x="50" y="50" width="260" height="190" fill="#f0f4f4" stroke="#888" stroke-width="1.5"/>
  <!-- axes : x vers la droite, y vers le bas -->
  <line x1="50" y1="50" x2="335" y2="50" stroke="#222" stroke-width="2" marker-end="url(#fleche)"/>
  <line x1="50" y1="50" x2="50" y2="265" stroke="#222" stroke-width="2" marker-end="url(#fleche)"/>
  <text x="338" y="45" font-style="italic">x</text>
  <text x="58" y="272" font-style="italic">y</text>
  <!-- origine -->
  <text x="14" y="40">(0, 0)</text>
  <!-- projections du point sur les axes -->
  <line x1="200" y1="50" x2="200" y2="150" stroke="#00897b" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="50" y1="150" x2="200" y2="150" stroke="#00897b" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="194" y="40" font-style="italic" fill="#00897b">x</text>
  <text x="34" y="155" font-style="italic" fill="#00897b">y</text>
  <!-- le point -->
  <rect x="195" y="145" width="10" height="10" fill="#2e7d32"/>
  <text x="212" y="172" font-weight="bold">M(x, y)</text>
</svg>
