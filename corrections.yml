# Liste des fichiers pour lesquels afficher les corrections
# Les chemins sont relatifs au dossier docs/
# Commenter ou supprimer une ligne pour masquer les corrections de ce fichier

show_corrections:
  # - projets/devine-mon-nombre.md
  - terminale/structures-de-donnees/piles-files/file.md
  - terminale/structures-de-donnees/arbres/arbrebinaire.md
  - terminale/structures-de-donnees/graphes.md
  # - premiere/prog/recursivite.md

# Pages où la question « Avant d'ouvrir la correction » est masquée avec la
# correction qu'elle annonce. Sur ces pages, tout bloc de réponse s'intitule
# « Correction », et c'est le TYPE d'admonition qui décide : warning pour une
# correction de code, masquée, success pour celle d'un exercice sur le cahier,
# que l'élève peut ouvrir. Les indices et les blocs de test restent visibles.
# Un chemin de fichier, ou un préfixe de répertoire.
# Pour tout rouvrir ponctuellement, ajouter la page à show_corrections ci-dessus.
hide_solutions:
  - terminale/structures-de-donnees/listes/maillons.md
  - terminale/structures-de-donnees/listes/liste.md
